name: Notion Sync

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes
  workflow_dispatch:          # manual trigger from GitHub app

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sync dependencies
        working-directory: scripts
        run: npm install

      - name: Run Notion sync
        working-directory: .
        run: node scripts/notion-sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit and push changes
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync[bot]@users.noreply.github.com"
          git add site/content/log/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: update training log from Notion"
            git push
          fi
